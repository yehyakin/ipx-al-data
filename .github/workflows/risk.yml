name: risk-data
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: restore previous data (first-seen state)
        run: |
          mkdir -p risk-data
          git fetch --depth=1 origin data && git --work-tree=risk-data checkout origin/data -- . || true
          git reset -q
          mkdir -p prev && cp risk-data/dc* risk-data/gf* risk-data/geofeed-urls.csv risk-data/vpn* risk-data/lease* risk-data/x4b* risk-data/LICENSE-X4B.txt prev/ 2>/dev/null || true
      - name: build
        run: python3 build-risk.py risk-data
      - name: build datacenter ranges (ipx 机房段库)
        continue-on-error: true
        run: python3 build-dc.py risk-data
      - name: build VPN / relay exit library (ipx VPN 出口库)
        continue-on-error: true
        run: python3 build-vpn.py risk-data
      - name: build VPN ranges from X4BNet/lists_vpn (MIT; C段画像着色用，不计分)
        continue-on-error: true
        timeout-minutes: 10
        run: python3 build-x4b.py risk-data || cp prev/x4b* prev/LICENSE-X4B.txt risk-data/ 2>/dev/null || true
      - name: build geofeed layer (ipx 地理层，每天一次)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          if [ "$(date -u +%H)" = "00" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ ! -f risk-data/gf.bin ]; then
            python3 build-geofeed.py risk-data
          fi
      - name: build RIR registration-date layer (ipx 登记日期层，每天一次)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          if [ "$(date -u +%H)" = "00" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ ! -f risk-data/rir.bin ]; then
            python3 build-rir.py risk-data
          fi
      - name: quality gate (离线把关：条数骤降或样本命中率异常的层继续用上一版)
        run: python3 check-data.py risk-data prev eval/atlas.tsv
      - name: publish orphan data branch
        run: |
          cd risk-data
          cat > README.md <<'MD'
          # ipx.al 风险库数据
          每 6 小时由 GitHub Actions 从公开威胁情报重新构建，只保留最新一份（无历史）。
          - `sources.csv`：区间、命中来源、首次出现日期（人可读）
          - `risk.bin`：每条 16 字节小端 start,end,mask,first（ipx.al 线上查询用）
          - `risk.json`：来源列表、条数、构建时间
          - `vpn.bin` / `vpn6.bin` / `vpn.json`：ipx VPN 出口库，Mullvad、NordVPN、PIA、IVPN、Surfshark 官方公布的服务器 IP 和 iCloud 专用代理出口表，说明见 build-vpn.py
          - `x4b.bin` / `x4b6.bin` / `x4b.json` / `LICENSE-X4B.txt`：VPN 网段层，来自 X4BNet/lists_vpn（MIT License，Copyright (c) 2026 X4B (Mathew Heard)，许可全文见 LICENSE-X4B.txt）的 VPN ASN 名单和人工网段，ASN 用 RIPE RIS 展开，说明见 build-x4b.py
          - `gf.bin` / `gf6.bin` / `gf.json` / `geofeed-urls.csv`：ipx 地理层，运营商自报的 RFC 8805 geofeed（按 RFC 9632 校验授权），说明见 build-geofeed.py
          - `lease.bin` / `lease.json`：ipx 租赁段（IPv4），RIPE / APNIC / AFRINIC / LACNIC whois 库和 ARIN RDAP 里带 IPXO 租赁市场标记（mnt-by netutils-mnt 或 geofeed.ipxo.com）的登记网段，和地理层同一遍扫描，说明见 build-geofeed.py
          - `dc.bin` / `dc.json` / `dc.csv`：ipx 机房段库（IPv4），云厂商官方段 + RIPE RIS 路由 + 人工机房 ASN + PeeringDB Content，说明见 build-dc.py
          - `hist/<a>.bin`（按第一段八位组分片）/ `hist.bin.gz`：近 90 天移出名单的 IPv4 区间，每条 20 字节 start,end,mask,first,last；first/last 是 ipx 每 6 小时构建观测到的日期（自开始记录起），见 build-risk.py
          - `risk6.bin`：IPv6 风险区间（v2：16 字节头 + 每条 40 字节，完整 128 位 start/end + mask + first；单个主机不再扩成 /64）
          - `rir.bin` / `rir6.bin` / `rir.json`：五大 RIR delegated-extended 的登记日期（最后一次登记变更日）和国家（v2：16 字节文件头，每条带 delegated 国家），说明见 build-rir.py
          来源与许可见 https://ipx.al/risk 。纠错请提 issue。
          MD
          git init -q -b data
          git -c user.name=ipx-bot -c user.email=actions@users.noreply.github.com add -A
          git -c user.name=ipx-bot -c user.email=actions@users.noreply.github.com commit -qm "risk data $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
      - name: report quality gate
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", R: "${{ github.repository }}" }
        run: |
          T="数据质量检查拦截"
          open=$(gh issue list -R $R --state open --search "$T in:title" --json number -q '.[0].number')
          if [ -s check.txt ]; then
            msg="$(cat check.txt) 记录：${{ github.server_url }}/$R/actions/runs/${{ github.run_id }}"
            [ -z "$open" ] && gh issue create -R $R -t "$T" -b "$msg" || gh issue comment "$open" -R $R -b "$msg"
          elif [ -n "$open" ]; then gh issue close "$open" -R $R -c "最新一次构建已通过检查。"; fi
      - name: keepalive (reset GitHub's 60-day inactivity timer)
        if: always()
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/risk.yml/enable || true
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/health.yml/enable || true
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/site.yml/enable || true
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/geo.yml/enable || true
      - name: report failure
        if: failure()
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          T="风险库构建失败"
          n=$(gh issue list -R ${{ github.repository }} --state open --search "$T in:title" --json number -q length)
          [ "$n" = "0" ] && gh issue create -R ${{ github.repository }} -t "$T" -b "构建失败：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
